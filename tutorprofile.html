<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Profile | EduConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="container nav-flex">
            <a href="index.html" class="brand-logo">
                <img src="assets/logo/logo.png" alt="EduConnect" class="logo-image">
            </a>
            <nav class="nav-links">
                <a href="tutorrequests.html" class="nav-item">Student Requests</a>
                <a href="tutorschedule.html" class="nav-item">My Schedule</a>
            </nav>
            <div class="nav-actions">
                <div class="user-menu" style="display:flex; align-items:center; gap:10px;">
                    <span class="role-badge" style="background: #e3f2fd; color: #1976d2; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;">Tutor</span>
                    <span style="font-weight:600;" id="userNameDisplay">Loading...</span>
                    <a href="#" style="font-size:0.9rem; color:red; margin-left:10px;" onclick="logout()">Log Out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container dashboard-layout">
        <aside class="dash-sidebar">
            <nav>
                <a href="tutordashboard.html" class="dash-link"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="tutorschedule.html" class="dash-link"><i class="fas fa-calendar-alt"></i> My Schedule</a>
                <a href="tutorearnings.html" class="dash-link"><i class="fas fa-wallet"></i> Earnings</a>
                <a href="tutorrequests.html" class="dash-link"><i class="fas fa-envelope-open-text"></i> Requests</a>
                <a href="tutorprofile.html" class="dash-link active"><i class="fas fa-id-card"></i> Public Profile</a>
            </nav>
        </aside>

        <main class="dash-content">
            <div class="auth-card" style="max-width: 100%; border: 1px solid #eee;">
                <h2 style="color: #000; margin-bottom: 0.5rem;">Edit Tutor Profile</h2>
                <p style="color:#666; margin-bottom: 2rem;">Manage how you appear to students in search results.</p>
                
                <form action="#" onsubmit="event.preventDefault(); alert('Profile Saved!');">
                    
                    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 2rem;">
                        <img id="profilePreview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #f0f0f0; border: 1px solid #ddd;" alt="Profile">
                        <div style="flex: 1;">
                        <label style="font-weight: 500;">Display Name</label><br>
                        <input type="text" id="fullName" value="Sarah Jenkins" style="margin-top: 5px; margin-bottom: 10px;">
    
                    <div>
                        <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="previewImage(event)">
                        <button type="button" class="btn btn-secondary" style="padding: 5px 10px; font-size: 0.8rem;" onclick="document.getElementById('imageUpload').click();">
                        <i class="fas fa-camera"></i> Change Photo
        </button>
    </div>
</div>
                    </div>

                    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label>Headline</label>
                            <input type="text" value="Certified Math Tutor | Calculus Specialist">
                        </div>
                        <div class="form-group">
                            <label>Hourly Rate ($)</label>
                            <input type="number" value="35" min="10">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Qualifications</label>
                        <input type="text" value="B.Sc. Mathematics, Certified Online Educator">
                    </div>

                    <div class="form-group">
                        <label>About Me / Bio</label>
                        <textarea id="bio" rows="5" style="width: 100%; padding: 0.7rem; border: 1px solid #e5e5e5; border-radius: 12px; background: #f9f9f9; resize: vertical;">Specialized in Maths and Calculus for high school students. I hope i can make complicated subjects enjoyable for you!
                        </textarea>
                    </div>

                    <div class="form-group">
                        <label style="margin-bottom: 10px;">Subjects</label>
                        <div class="subject-input-group">
                            <input type="text" id="subjectInput" placeholder="Type a subject..." style="flex: 1;">
                            <button type="button" class="btn btn-secondary" onclick="addSubject()">Add</button>
                        </div>
                        <div class="tags-container" id="tagsContainer">
                            <div class="custom-tag">Calculus I<i class="fas fa-times tag-close" onclick="this.parentElement.remove()"></i></div>
                            <div class="custom-tag">Calculus II<i class="fas fa-times tag-close" onclick="this.parentElement.remove()"></i></div>
                            <div class="custom-tag">Mathematics<i class="fas fa-times tag-close" onclick="this.parentElement.remove()"></i></div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/profile.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Initialize authentication
        document.addEventListener('DOMContentLoaded', function() {
            initAuth();
            loadTutorProfile();
        });

        // Load tutor profile data
        async function loadTutorProfile() {
            const user = getCurrentUser();
            if (!user || user.role !== 'tutor') {
                redirectByRole('tutor');
                return;
            }

            // Update form with user data
            const fullNameInput = document.getElementById('fullName');
            const bioInput = document.getElementById('bio');
            
            if (fullNameInput) fullNameInput.value = user.full_name;
            if (bioInput) bioInput.value = user.bio || '';
            
            // Load tutor-specific data
            try {
                const response = await authenticatedFetch('/tutor/profile');
                const data = await response.json();
                
                if (data.success && bioInput) {
                    bioInput.value = data.data.bio || '';
                }
            } catch (error) {
                console.error('Error loading tutor profile:', error);
            }
        }
    </script>

</body>
</html>
