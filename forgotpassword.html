<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EduConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-body" style="background-color: #f5f5f5;">

    <header class="main-header" style="position: absolute; top:0; width:100%;">
        <div class="container nav-flex">
            <a href="index.html" class="brand-logo">
                <img src="assets/logo/logo.png" alt="EduConnect" class="logo-image">
            </a>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-primary" style="padding: 0.4rem 1.2rem; font-size: 0.9rem;">Back to Login</a>
            </div>
        </div>
    </header>

    <div class="auth-container" style="margin-top: 60px;">
        <div class="auth-card" id="requestCard">
            <h2 style="color: #000; margin-bottom: 0.5rem;">Forgot Password?</h2>
            <p class="auth-subtitle">Enter your email address and we'll send you a reset link.</p>
            
            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="user@email.com" required>
                </div>

                <div id="errorMessage" style="display: none; color: red; background: #ffe6e6; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;"></div>
                <div id="successMessage" style="display: none; color: green; background: #e6ffe6; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;"></div>

                <button type="submit" class="btn btn-primary full-width" style="margin-top: 1rem;" id="submitBtn">Send Reset Link</button>
            </form>
        </div>

        <div class="auth-card" id="resetCard" style="display: none;">
            <h2 style="color: #000; margin-bottom: 0.5rem;">Reset Password</h2>
            <p class="auth-subtitle">Enter your new password below.</p>
            
            <form id="resetPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="••••••••" required>
                    <small class="validation-hint">Min 8 characters, include 1 symbol.</small>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="••••••••" required>
                </div>

                <div id="resetErrorMessage" style="display: none; color: red; background: #ffe6e6; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;"></div>
                <div id="resetSuccessMessage" style="display: none; color: green; background: #e6ffe6; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;"></div>

                <button type="submit" class="btn btn-primary full-width" style="margin-top: 1rem;" id="resetSubmitBtn">Update Password</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        // 1. Initial State: Check for token in URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (token) {
            document.getElementById('requestCard').style.display = 'none';
            document.getElementById('resetCard').style.display = 'block';
        }

        // 2. Handling Request Reset Form
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            btn.disabled = true;
            btn.textContent = 'Verifying...';
            errorDiv.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.success) {
                    successDiv.style.display = 'block';
                    // Check if email was actually sent or if we need to show the token fallback
                    if (data.emailSent) {
                        successDiv.textContent = 'Success! Please check your email inbox for the reset link.';
                    } else if (data.resetToken) {
                        // FALLBACK: Use this if your SMTP isn't set up yet
                        const debugUrl = `${window.location.origin}${window.location.pathname}?token=${data.resetToken}`;
                        successDiv.innerHTML = `
                            Email service not ready. Use this dev-link:<br>
                            <a href="${debugUrl}" style="color:blue; font-weight:bold;">Reset Password Now (Debug)</a>
                        `;
                    }
                    document.getElementById('forgotPasswordForm').reset();
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = "Server is offline. Start your Node.js app!";
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        });

        // 3. Handling Reset Password Form
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;
            const btn = document.getElementById('resetSubmitBtn');
            const errorDiv = document.getElementById('resetErrorMessage');
            const successDiv = document.getElementById('resetSuccessMessage');

            if (password !== confirmPassword) {
                errorDiv.textContent = "Passwords do not match.";
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const res = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password, confirmPassword })
                });
                const data = await res.json();

                if (data.success) {
                    successDiv.textContent = "Password updated! Redirecting to login...";
                    successDiv.style.display = 'block';
                    setTimeout(() => window.location.href = 'login.html', 2500);
                } else {
                    errorDiv.textContent = data.message || "Invalid or expired link.";
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Update Password';
                }
            } catch (err) {
                errorDiv.textContent = "Error updating password.";
                errorDiv.style.display = 'block';
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
