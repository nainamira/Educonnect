<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Details | EduConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .detail-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid #f0f0f0;
        }
        .tutor-header-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .stat-box {
            background: #f8fafc;
            padding: 15px 25px;
            border-radius: 12px;
            min-width: 120px;
        }
        .stat-val { display: block; font-size: 1.3rem; font-weight: 700; color: #1e293b; }
        .stat-label { color: #64748b; font-size: 0.85rem; font-weight: 500; }
        .bio-section { text-align: left; margin-top: 30px; padding: 20px; background: #fff; border-radius: 12px; }
        .btn-book {
            background: #1976d2;
            color: white;
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.3);
        }
        .btn-book:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(25, 118, 210, 0.4); background: #1565c0; }
    </style>
</head>
<body style="background-color: #fbfcfe;">

    <nav style="padding: 15px 5%; background: white; border-bottom: 1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0; color:#1976d2;">EduConnect</h2>
        <a href="tutors.html" style="text-decoration: none; color: #64748b; font-weight:500;">
            <i class="fas fa-arrow-left"></i> Back to Tutors
        </a>
    </nav>

    <div class="container" style="max-width: 700px; margin: 50px auto; padding: 0 20px;">
        <div class="detail-card">
            <img id="tutorImage" src="assets/default-avatar.png" class="tutor-header-img">
            
            <h1 id="tutorName" style="margin-bottom: 5px; color: #0f172a;">Loading...</h1>
            <p id="tutorSubject" style="color: #1976d2; font-size: 1.1rem; font-weight: 600;">Expert Tutor</p>
            
            <div style="display: flex; justify-content: center; gap: 20px; margin: 30px 0;">
                <div class="stat-box">
                    <span class="stat-val" style="color: #f59e0b;">⭐ <span id="tutorRating">0.0</span></span>
                    <span class="stat-label">Rating</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val">$<span id="tutorRate">0</span></span>
                    <span class="stat-label">Hourly Rate</span>
                </div>
            </div>

            <div class="bio-section">
                <h3 style="margin-bottom: 12px; color: #1e293b;"><i class="fas fa-user-circle"></i> About Me</h3>
                <p id="tutorBio" style="line-height: 1.7; color: #475569; font-size: 1rem;">
                    Please wait while we fetch the tutor's biography...
                </p>
            </div>

            <div style="margin-top: 40px;">
                <button id="bookBtn" onclick="bookCurrentTutor()" class="btn-book">
                    Book a Session Now
                </button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tutorId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!tutorId) {
                window.location.href = 'tutors.html';
                return;
            }

            try {
                // Memanggil API MySQL anda
                const response = await fetch(`http://localhost:5000/api/tutors/${tutorId}`);
                const result = await response.json();

                if (result.success) {
                    const tutor = result.data;
                    
                    document.getElementById('tutorName').innerText = tutor.full_name;
                    document.getElementById('tutorSubject').innerText = tutor.subject_name || 'Expert Tutor';
                    document.getElementById('tutorBio').innerText = tutor.bio || 'This tutor has not provided a biography yet.';
                    document.getElementById('tutorRate').innerText = tutor.hourly_rate;
                    document.getElementById('tutorRating').innerText = tutor.rating || 'New';
                    
                    if (tutor.profile_pic) {
                        document.getElementById('tutorImage').src = tutor.profile_pic;
                    }
                } else {
                    document.getElementById('tutorName').innerText = "Tutor Not Found";
                }
            } catch (err) {
                console.error("Fetch error:", err);
                document.getElementById('tutorBio').innerText = "Error connecting to the database.";
            }
        });

        function bookCurrentTutor() {
            const user = localStorage.getItem('user');
            if (!user) {
                alert("Please log in to book a session.");
                window.location.href = 'login.html';
                return;
            }
            
            // Simpan ID tutor yang dipilih ke localStorage untuk digunakan di booking.html
            localStorage.setItem('selectedTutorId', tutorId);
            window.location.href = 'booking.html';
        }
    </script>
</body>
</html>
