<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed! | EduConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background-color: #f4f7f6; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        
        .success-card {
            background: white; 
            width: 100%; 
            max-width: 450px; 
            padding: 40px; 
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            text-align: center; 
        }

        .icon-circle {
            width: 80px; height: 80px; 
            background: #d4edda; color: #155724; 
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center; 
            font-size: 40px; margin: 0 auto 20px auto;
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn { 
            0% { transform: scale(0); } 
            80% { transform: scale(1.1); } 
            100% { transform: scale(1); } 
        }

        h1 { margin: 0 0 10px 0; color: #333; font-size: 1.8rem; }
        p { color: #666; line-height: 1.5; margin-bottom: 25px; }

        .receipt-box {
            background: #f8f9fa; 
            border: 2px dashed #e0e0e0; 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 30px; 
            text-align: left;
        }

        .receipt-row { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 12px; 
            font-size: 0.95rem;
        }
        .receipt-row:last-child { 
            margin-bottom: 0; 
            padding-top: 12px; 
            border-top: 1px solid #ddd; 
            font-weight: bold; 
            font-size: 1.1rem; 
            color: #000;
        }
        
        .label { color: #888; }
        .value { color: #333; font-weight: 600; }

        .btn-dashboard {
            background: #000; 
            color: white; 
            text-decoration: none; 
            padding: 15px 30px; 
            border-radius: 30px;
            display: block; 
            width: 100%;
            box-sizing: border-box;
            font-weight: bold; 
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-dashboard:hover { 
            background: #333; 
            transform: translateY(-2px); 
        }

        .redirect-text {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-circle">
            <i class="fas fa-check"></i>
        </div>
        <h1>Booking Successful!</h1>
        <p>Your session is confirmed. We have sent a receipt to <span id="emailDisplay" style="font-weight:bold; color: #333;">your email</span>.</p>

        <div class="receipt-box">
            <div class="receipt-row">
                <span class="label">Booking ID</span>
                <span class="value" id="bookingId">...</span>
            </div>
            <div class="receipt-row">
                <span class="label">Date</span>
                <span class="value" id="dateDisplay">...</span>
            </div>
            <div class="receipt-row">
                <span class="label">Time</span>
                <span class="value" id="timeDisplay">...</span>
            </div>
            <div class="receipt-row">
                <span class="label">Duration</span>
                <span class="value" id="durationDisplay">...</span>
            </div>
            <div class="receipt-row">
                <span class="label">Total Paid</span>
                <span class="value" id="amountDisplay">...</span>
            </div>
        </div>

        <button onclick="window.location.href='studentdashboard.html'" class="btn-dashboard" id="redirectBtn">
            Go to Dashboard (5)
        </button>
        
        <div class="redirect-text">
            Automatically redirecting in <span id="timer">5</span> seconds...
        </div>
    </div>

    <script>
        // 1. Load Data from LocalStorage
        const bookingData = JSON.parse(localStorage.getItem('lastBooking'));

        if (bookingData) {
            document.getElementById('bookingId').textContent = '#' + bookingData.id;
            document.getElementById('emailDisplay').textContent = bookingData.email;
            
            // Format Date nicely
            const dateObj = new Date(bookingData.date);
            document.getElementById('dateDisplay').textContent = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            
            document.getElementById('timeDisplay').textContent = bookingData.time;
            document.getElementById('durationDisplay').textContent = bookingData.hours + " Hour(s)";
            document.getElementById('amountDisplay').textContent = "$" + parseFloat(bookingData.price).toFixed(2);
        }

        // 2. Countdown and Redirect Logic
        let seconds = 5;
        const timerSpan = document.getElementById('timer');
        const btn = document.getElementById('redirectBtn');

        const countdown = setInterval(() => {
            seconds--;
            
            // Update Text
            timerSpan.textContent = seconds;
            btn.innerText = `Go to Dashboard (${seconds})`;

            // When timer hits 0
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = 'studentdashboard.html';
            }
        }, 1000); // Run every 1 second
    </script>
</body>
</html>
