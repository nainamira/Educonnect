<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Tutors | EduConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Card Styles */
        .tutor-card {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all 0.3s ease;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .tutor-card:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transform: translateY(-5px);
        }
        .tutor-profile-row { display: flex; align-items: center; gap: 15px; }
        .tutor-avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background-color: #f0f0f0; }
        .tutor-info h3 { font-size: 1.1rem; margin: 0; color: #333; }
        .tutor-subject { color: #1976d2; font-size: 0.85rem; font-weight: 600; margin: 2px 0; }
        .tutor-rating { color: #fbbf24; font-size: 0.85rem; }
        .tutor-description { font-size: 0.9rem; color: #666; line-height: 1.5; min-height: 45px; }
        .card-footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .price-tag { font-size: 1.1rem; font-weight: bold; color: #2d3436; }
        .tutor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container nav-flex">
            <a href="index.html" class="brand-logo">
                <img src="assets/logo/logo.png" alt="EduConnect" class="logo-image">
            </a>
            <nav class="nav-links">
                <a href="tutors.html" class="nav-item active">Find Tutors</a>
                <a href="subjects.html" class="nav-item">Subjects</a>
            </nav>
            <div class="nav-actions" id="auth-actions">
                <a href="login.html" class="btn btn-secondary">Log In</a>
                <a href="register.html" class="btn btn-primary">Get Started</a>
            </div>
        </div>
    </header>

    <div class="container main-layout" style="display: flex; gap: 30px; margin-top: 30px;">
        <aside class="sidebar" style="flex: 1; max-width: 250px;">
            <h3 style="margin-bottom: 1.5rem;">Filters</h3>
            
            <div class="filter-group">
                <h4>Search</h4>
                <input type="text" id="searchInput" placeholder="Search name or subject..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
            </div>

            <div class="filter-group" style="margin-top: 20px;">
                <h4>Max Price: $<span id="priceValue">100</span></h4>
                <input type="range" id="priceSlider" min="10" max="100" value="100" style="width:100%">
            </div>

            <button id="resetBtn" class="btn btn-secondary" style="width:100%; margin-top:20px;">Clear All</button>
        </aside>

        <main style="flex: 3;">
            <div class="tutor-grid" id="tutorGrid">
                </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tutorGrid = document.getElementById('tutorGrid');
            const searchInput = document.getElementById('searchInput');
            const priceSlider = document.getElementById('priceSlider');
            const priceValue = document.getElementById('priceValue');

            // 1. Fungsi Ambil Data Tutor dari Backend
            async function loadTutors() {
                const search = searchInput.value;
                const maxPrice = priceSlider.value;
                
                tutorGrid.innerHTML = '<p>Searching for tutors...</p>';

                try {
                    const response = await fetch(`http://localhost:5000/api/tutors?search=${search}&price=${maxPrice}`);
                    const result = await response.json();

                    if (result.success) {
                        renderTutors(result.data);
                    }
                } catch (error) {
                    tutorGrid.innerHTML = '<p>Error loading tutors. Please ensure server is running.</p>';
                }
            }

            // 2. Fungsi Papar Kad Tutor
            function renderTutors(tutors) {
                if (tutors.length === 0) {
                    tutorGrid.innerHTML = '<p>No tutors found matching your criteria.</p>';
                    return;
                }

                tutorGrid.innerHTML = tutors.map(tutor => `
                    <div class="tutor-card">
                        <div class="tutor-profile-row">
                            <img src="${tutor.profile_pic || 'assets/default-avatar.png'}" class="tutor-avatar">
                            <div class="tutor-info">
                                <h3>${tutor.full_name}</h3>
                                <p class="tutor-subject">${tutor.subject_name}</p>
                                <div class="tutor-rating">
                                    <i class="fas fa-star"></i> ${tutor.rating || 'New'}
                                </div>
                            </div>
                        </div>
                        <p class="tutor-description">${tutor.bio ? tutor.bio.substring(0, 100) + '...' : 'Professional tutor ready to help you succeed.'}</p>
                        <div class="card-footer-row">
                            <span class="price-tag">$${tutor.hourly_rate}<small>/hr</small></span>
                            <button onclick="bookTutor(${tutor.id})" class="btn btn-primary">Book Session</button>
                        </div>
                    </div>
                `).join('');
            }

            // Event Listeners
            searchInput.addEventListener('input', loadTutors);
            priceSlider.addEventListener('input', (e) => {
                priceValue.textContent = e.target.value;
                loadTutors();
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                searchInput.value = '';
                priceSlider.value = 100;
                priceValue.textContent = 100;
                loadTutors();
            });

            loadTutors(); // Load data bila page dibuka
        });

        function bookTutor(id) {
            const user = localStorage.getItem('user');
            if (!user) {
                alert('Please login as a student to book a session.');
                window.location.href = 'login.html';
                return;
            }
            window.location.href = `book-tutor.html?tutor_id=${id}`;
        }
    </script>
</body>
</html>
