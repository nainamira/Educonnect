<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | EduConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="container nav-flex">
            <a href="index.html" class="brand-logo">
                <img src="assets/logo/logo.png" alt="EduConnect" class="logo-image">
            </a>
            <nav class="nav-links">
                <a href="tutors.html" class="nav-item">Find Tutors</a>
                <a href="studentschedule.html" class="nav-item">My Schedule</a>
            </nav>
            <div class="nav-actions">
                <div class="user-menu" style="display:flex; align-items:center; gap:10px;">
                    <span class="role-badge" style="background: #e8f5e8; color: #2e7d32; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;">Student</span>
                    <span style="font-weight:600;" id="userNameDisplay">Loading...</span>
                    <a href="#" style="font-size:0.9rem; color:red; margin-left:10px;" onclick="logout()">Log Out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container dashboard-layout">
        <aside class="dash-sidebar">
            <nav>
                <a href="studentdashboard.html" class="dash-link"><i class="fas fa-home"></i> Dashboard</a>
                <a href="studentschedule.html" class="dash-link"><i class="fas fa-calendar-alt"></i> Schedule</a>
                <a href="studenthistory.html" class="dash-link"><i class="fas fa-history"></i> History</a>
                <a href="studentprofile.html" class="dash-link active"><i class="fas fa-user-cog"></i> Profile Settings</a>
            </nav>
        </aside>

        <main class="dash-content">
            <div class="auth-card" style="max-width: 100%; border: 1px solid #eee;">
                <h2 style="color: #000; margin-bottom: 1.5rem;">Edit Student Profile</h2>
                
                <form action="#" onsubmit="event.preventDefault(); alert('Profile Saved!');">
                    
                    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 2rem;">
                        <img id="profilePreview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #f0f0f0; border: 1px solid #ddd;" alt="Profile">
                        <div>
                            <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="previewImage(event)">
                            <button type="button" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.4rem 1rem;" onclick="document.getElementById('imageUpload').click();">
                                <i class="fas fa-camera"></i> Change Photo
                            </button>
                            <p style="font-size: 0.8rem; color: #888; margin-top: 5px;">Max size: 2MB</p>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="fullNameInput" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="phoneInput" placeholder="+60 11 2345 6789">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="emailInput" disabled style="background-color: #eee; cursor: not-allowed;">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/profile.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Load user data into form fields
        document.addEventListener('DOMContentLoaded', function() {
            const userStr = localStorage.getItem('user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    
                    // Update form fields
                    const fullNameInput = document.getElementById('fullNameInput');
                    const emailInput = document.getElementById('emailInput');
                    
                    if (fullNameInput) {
                        fullNameInput.value = user.full_name || '';
                    }
                    if (emailInput) {
                        emailInput.value = user.email || '';
                    }
                } catch (error) {
                    console.error('Error loading user data:', error);
                }
            }
        });
    </script>

    <script src="js/auth.js"></script>
    <script>
        // Initialize authentication
        document.addEventListener('DOMContentLoaded', function() {
            initAuth();
            loadStudentProfile();
        });

        // Load student profile data
        async function loadStudentProfile() {
            const user = getCurrentUser();
            if (!user || user.role !== 'student') {
                redirectByRole('student');
                return;
            }

            // Update form with user data
            const fullNameInput = document.getElementById('fullName');
            const emailInput = document.getElementById('email');
            
            if (fullNameInput) fullNameInput.value = user.full_name;
            if (emailInput) emailInput.value = user.email;
        }
    </script>

</body>
</html>
